# This production Compose file is optimized for deployment instead of local development.
# It builds a lean runtime image, avoids mounting the source tree into the container, and keeps the app connected to the shared project network so it can reach backend services without extra configuration.
services:
  # The frontend service in production runs the built app as a standalone container.
  # Unlike the development configuration, this version is intentionally stripped down to reduce runtime overhead and keep the image small.
  frontend:
    # Build the container image from the current directory using the production-oriented Dockerfile setup.
    build: .
    # Use a fixed container name so the running instance is easy to identify and manage with Docker commands.
    container_name: 02_rsc_wp_bun_vue_frontend
    # Backend port: single source is the root ./.env PORT. container-management.sh
    # exports it, and Compose interpolates ${PORT} here (env_file cannot). The host
    # is the backend container name on the shared Compose network; the frontend's
    # own localhost is itself, so the host is named explicitly.
    environment:
      PORT: ${PORT:-4001}
      API_HOST: 01_rsc_wpm_bun_psgres-backend
    # Attach the container to the shared project network so it can discover and communicate with other services such as the backend.
    networks:
      - rsc-network
    # No bind mount is used here.
    # This keeps the production container self-contained and lean, while the .dockerignore file excludes unnecessary files such as tests to reduce image size.
