name: Sync repository labels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/labels.yml"

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -I=0 emits one compact JSON object per line. Without it yq
          # pretty-prints each label across many lines, and the read below
          # then feeds jq line fragments instead of whole objects.
          yq -o=json -I=0 '.labels[]' .github/labels.yml |
          while read -r label; do

            name=$(echo "$label" | jq -r '.name')
            color=$(echo "$label" | jq -r '.color')
            description=$(echo "$label" | jq -r '.description')

            echo "Syncing label: $name"

            gh label create "$name" \
              --color "$color" \
              --description "$description" \
              --force

          done
