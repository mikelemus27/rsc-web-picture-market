services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: wpm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rsc-network

  backend:
    build: .
    container_name: 01_rsc_wpm_bun_psgres-backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: wpm_db
      DB_PORT: 5432
    depends_on:
      - postgres
    networks:
      - rsc-network


volumes:
  postgres_data:

networks:
  rsc-network:
    driver: bridge
